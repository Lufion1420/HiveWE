<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><title>VFX Sandbox / A / Copy as Lua dialog (second step)</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="widgets.css"></head>
<body><script src="icons.js"></script><script src="common.js"></script>
<script>
const code = `-- Frost Judgement (HiveWE VFX Sandbox)
-- x, y: target point. dx, dy, height: map units. delay, remove: seconds.
local steps = {
    { delay = 0.00, remove = 1.33, dx = -384.0, dy = 0.0, height = 0.0, scale = 1.00,
      model = [[Abilities\\Spells\\Human\\ThunderClap\\ThunderClapCaster.mdx]] },
    { delay = 0.30, remove = 2.70, dx = 0.0, dy = 0.0, height = 0.0, scale = 1.40,
      model = [[Abilities\\Spells\\Human\\FlameStrike\\FlameStrikeTarget.mdx]] },
    { delay = 0.80, remove = 1.80, dx = 0.0, dy = 0.0, height = 32.0, scale = 0.80,
      color = { 200, 240, 255 },
      model = [[Abilities\\Spells\\Undead\\FrostNova\\FrostNovaTarget.mdx]] },
    -- 2 more steps
}

function PlayFrostJudgement(x, y)
    for _, s in ipairs(steps) do
        local start = CreateTimer()
        TimerStart(start, s.delay, false, function()
            DestroyTimer(start)
            local e = AddSpecialEffect(s.model, x + s.dx, y + s.dy)
            BlzSetSpecialEffectHeight(e, s.height)
            BlzSetSpecialEffectScale(e, s.scale)
            if s.color then BlzSetSpecialEffectColor(e, table.unpack(s.color)) end
            local stop = CreateTimer()
            TimerStart(stop, s.remove, false, function()
                DestroyTimer(stop)
                DestroyEffect(e)
            end)
        end)
    end
end`;
document.body.innerHTML = `<div class="window">${titlebar('Copy as Lua')}<div class="dialog" style="flex:1;height:auto;min-height:0"><div class="inner">
	<div class="row" style="gap:8px;flex:none"><span class="nw">Function name</span><div class="edit" style="width:220px">PlayFrostJudgement</div><div class="grow"></div>${check('Skip hidden effects', true)}</div>
	<div class="code">${code}</div>
	<div class="small muted" style="flex:none">5 effects, 1 hidden effect skipped. Check animation and height in game.</div>
	<div class="row" style="gap:6px;justify-content:flex-end;flex:none">${btn('Copy to Clipboard', 'default')}${btn('Close')}</div></div></div></div>`;
</script></body></html>
