<!doctype html>
<html data-theme="dark"><head><meta charset="utf-8"><title>VFX Sandbox / A / Effect list and warning states</title>
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="widgets.css"></head>
<body><script src="icons.js"></script><script src="common.js"></script>
<script>
const panel = (caption, html) => `<div class="col" style="gap:6px;flex:none;width:274px;height:100%"><div class="small muted" style="height:16px">${caption}</div><div class="row grow" style="align-items:stretch;border:1px solid var(--color-border)">${html}</div></div>`;
const p1 = library({ source: 'Custom', counts: ['430', '0', '430'], rows: [], scroll: false, status: '0 custom effects, 0 shown',
	message: 'This map has no imported .mdx files.<br>Add them with the Asset Manager, or pick Stock.' });
const p2 = library({ source: 'Stock', query: 'meteor', rows: [], scroll: false, status: '430 stock effects, 0 shown',
	message: 'No stock effect matches &quot;meteor&quot;.<br>Try All, or include unit and doodad models.' });
const p3 = library({ source: 'Custom', rows: [['cfire', 'sel'], ['cold'], ['carc'], ['cheal']], scroll: false, status: '38 custom effects, 38 shown' });
const warnBox = `<div class="dock" style="width:300px;border:1px solid var(--color-border)"><div class="dtitle">Effect<span class="dbtns">&#10064; &#10005;</span></div><div class="dbody">
	<div class="row" style="gap:8px;flex:none">${thumb('cheal')}<div class="col" style="gap:3px"><div class="strong">HealingBloom.mdx</div><div class="small muted">Custom (map import)</div></div></div>
	<div class="row warn" style="gap:6px;align-items:flex-start;flex:none">${ic('warning', 's')}<div style="line-height:1.45">Partly shown: this model has ribbon emitters, which HiveWE cannot draw yet. It will look different in game.</div></div></div></div>`;
document.body.innerHTML = `<div class="row" style="height:100%;gap:14px;padding:12px;align-items:stretch">
	${panel('Map without imports', p1)}${panel('Search without a match', p2)}${panel('Unreadable model: &quot;!&quot; tile', p3)}
	<div class="col" style="gap:6px;flex:none;width:300px;height:100%"><div class="small muted" style="height:16px">Effect HiveWE can only partly draw</div>${warnBox}</div></div>`;
</script></body></html>
